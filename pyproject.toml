[project]
name = "terratrust"
version = "0.1.0"
description = "Human-in-the-loop land-cover screening with calibrated uncertainty"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "python-multipart==0.0.20",
    "scikit-learn==1.7.1",
    "numpy==2.3.2",
    "pandas==2.3.1",
    "Pillow==11.3.0",
    "joblib==1.5.1",
]

[tool.vercel]
entrypoint = "api:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
